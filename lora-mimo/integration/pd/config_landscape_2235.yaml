# Grouper<->Trouper landscape floorplan.
# See planning/grouper-trouper-landscape-floorplan-2026-08.md for rationale and
# open items before submitting this.
#
# Converted 2026-08-22 from an earlier OpenLane2-JSON-style skeleton (Trouper's
# dialect) to LibreLane's native YAML format (Grouper's dialect) -- see
# planning doc Open Item #6. Same underlying LibreLane config variables either
# way (FP_OBSTRUCTIONS/IO_PIN_ORDER_CFG/PDN_CFG/MACROS are not tied to either
# format); chosen so Grouper's SRAM macro placement (Open Item #5) can go
# inline instead of needing a translated side-file.
#
# DESIGN_NAME/VERILOG_FILES/USE_SLANG/VERILOG_DEFINES below are carried over
# from synth_only_chip_top.yaml (2026-08-22, job 4665: confirmed synthesizes
# cleanly against gf180mcu_fd_sc_mcu7t5v0 -- 1,187,173 um^2, 43,699 cells).
# That was a synth-only check (--to Yosys.Synthesis, no floorplan/PDN); this
# file is the real floorplan config built on the same verified RTL/settings.

meta:
  version: 3
  # Unfenced placement baseline; pin groups are assigned to their legal lobe.
  flow: Classic

# STATUS (not a real config key -- `_STATUS` was rejected by LibreLane's
# schema validation, confirmed 2026-08-22, job 4675 -- unlike the informal
# JSON-skeleton stage, YAML config keys are validated strictly):
# Die/obstruction/pin-order geometry is settled and chip_top synthesizes
# cleanly (job 4667, full grouper_soc_top+trouper_top+bridge rewrite).
#
# Floorplan orientation -- read from what the flow actually executes, not the
# earlier plan: Grouper is the NW L-shape (top-left quadrant + the strip west
# of Obstruction B; its 4 SRAMs sit in this lobe -- see MACROS below),
# Trouper is the SE square (bottom-right quadrant). Confirmed by the PDN
# VSRC_LOC comments further down, which label the west sources "Grouper" and
# the east sources "Trouper". So Grouper's board-facing edges are #N/#W and
# Trouper's are #S/#E.
# NOTE: an earlier revision of this header and of planning/grouper-trouper-
# landscape-floorplan-2026-08.md had the two projects swapped (Trouper on
# N/W) -- corrected 2026-08-27.
#
# io_placement_landscape.cfg -- rewritten 2026-08-27 to the first real
# combined pinout: Trouper datapath on #S (radio-facing) and #E (PSRAM +
# IRQ_OUT + power); Grouper's uart/gpio on #W and #N; the <=10 MHz host SPI
# slave (HOST_CS/SPI_*) moved to #N's east end (off the crowded SE side,
# tolerates the long route). One VSS/VDD pair per project on its own edge.
# See that file's header for the per-side slot budget. One precondition
# before a run: chip_top.v must expose Grouper's uart/gpio/power pads
# (currently tied off). The SRAM row is left at job 5069's y=1695.67 -- the
# #N Grouper nets route over it on M4/M5 (see MACROS). The GRP_* interconnect
# is not chip pads -- it is internal, crossed by u_bridge in chip_top.v.
# Full-flow status: job 5069 = previous Trouper-only pinout, clean DRC/LVS,
# SS setup open (planning doc item 19). The 2026-08-27 combined pinout +
# Grouper pads ran clean (DRC 0 / LVS 0 / hold clean) across an HCLK sweep
# -- jobs 5132 (16 MHz), 5131 (25 MHz), 5133 (32 MHz). All MEET at nom_tt
# (+9.8..+8.1 ns) and min_ff; SS setup fails at every point (-13.6 / -15.2
# / -16.3 ns), bottleneck crossing from Trouper's IQ_CLK32 to Grouper's
# CPU->SRAM decode cone between 16 and 25 MHz. The pinout/pads are
# timing-neutral vs 5069 (5132 -13.56 vs -14.32 ns SS). 25 MHz judged
# feasible for the test chip -- see planning doc item 20 and
# integration/planning/Open Risks.md #4.

