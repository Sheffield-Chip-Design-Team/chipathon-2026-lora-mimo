# Grouper<->Trouper landscape floorplan.
# See planning/grouper-trouper-landscape-floorplan-2026-08.md for rationale and
# open items before submitting this.
#
# Converted 2026-08-22 from an earlier OpenLane2-JSON-style skeleton (Trouper's
# dialect) to LibreLane's native YAML format (Grouper's dialect) -- see
# planning doc Open Item #6. Same underlying LibreLane config variables either
# way (FP_OBSTRUCTIONS/IO_PIN_ORDER_CFG/PDN_CFG/MACROS are not tied to either
# format); chosen so Grouper's SRAM macro placement (Open Item #5) can go
# inline instead of needing a translated side-file.
#
# DESIGN_NAME/VERILOG_FILES/USE_SLANG/VERILOG_DEFINES below are carried over
# from synth_only_chip_top.yaml (2026-08-22, job 4665: confirmed synthesizes
# cleanly against gf180mcu_fd_sc_mcu7t5v0 -- 1,187,173 um^2, 43,699 cells).
# That was a synth-only check (--to Yosys.Synthesis, no floorplan/PDN); this
# file is the real floorplan config built on the same verified RTL/settings.

meta:
  version: 3
  # Unfenced placement baseline; pin groups are assigned to their legal lobe.
  flow: Classic

# STATUS (not a real config key -- `_STATUS` was rejected by LibreLane's
# schema validation, confirmed 2026-08-22, job 4675 -- unlike the informal
# JSON-skeleton stage, YAML config keys are validated strictly):
# Die/obstruction/pin-order geometry is settled and chip_top synthesizes
# cleanly (job 4667, full grouper_soc_top+trouper_top+bridge rewrite).
# io_placement_landscape.cfg has a temporary pin-side guard (real Trouper
# pins on N/W, GRP_* bus + catch-all on S/E) so Grouper pins can't default
# onto Trouper's side, but it is NOT a real pinout (Open Item #4, deferred).
# Not yet run as a full floorplan/PnR flow -- only synthesis has been
# verified so far, and PDN_CFG below is disabled (see its own note) until a
# real pdn_cfg.tcl exists.

DESIGN_NAME: chip_top
