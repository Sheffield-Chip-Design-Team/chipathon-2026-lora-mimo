# Synthesis-only check for the combined Grouper<->Trouper chip_top -- NOT a
# hardening config: no floorplan, no PDN, never taped out. Modeled on Grouper's
# own librelane/measure/*.yaml pattern (see that dir's README.md), which exists
# for exactly this purpose (`--to Yosys.Synthesis`).
#
# Why this exists instead of a plain `yosys -s` run: plain yosys's built-in SV
# frontend chokes on Grouper's own ahb3lite_pkg.sv (a `return` statement inside
# an SV function -- confirmed 2026-08-22, job 4663). Grouper's own working PD
# configs set USE_SLANG: true, which swaps in the slang frontend LibreLane
# bundles -- that's the difference, not anything about chip_top.v itself. See
# planning/grouper-trouper-landscape-floorplan-2026-08.md Open Item #1.
#
# Run with: librelane synth_only_chip_top.yaml --to Yosys.Synthesis
#   --pdk gf180mcuD --pdk-root /foss/pdks --manual-pdk --run-tag chip_top_synth
#
# 2026-08-22, rewritten: chip_top.v now instantiates Grouper's real
# grouper_soc_top (the whole SoC -- CPU, ROM, RAM, UART, GPIO, periph_ss) as
# a single top-level module instead of hand-picking submodules and
# reimplementing their interconnect. VERILOG_FILES below is Grouper's own
# full file list from librelane/classic/config.yaml (the authoritative
# source), minus its grouper_soc_chip_core padframe wrapper (chip_top.v
# instantiates grouper_soc_top directly, one level in from that). This
# needed a small local patch to grouper_soc_top.sv itself -- see that file's
# header -- to expose its "External AHB Master Interface" instead of tying
# it off dead; that's the port chip_top.v bridges to Trouper on.
# MACRO_RAM is deliberately NOT set here (unlike config_landscape_2235.yaml),
# so ram_ss falls back to its behavioural array path instead of needing the
# real SRAM macro's GDS/LEF for this fast synth-only check.

DESIGN_NAME: chip_top

VERILOG_FILES:
- dir::../ip/grouper/hw/rtl/ahb3lite/ahb3lite_pkg.sv
- dir::../ip/grouper/hw/rtl/common/clk_div.sv
- dir::../ip/grouper/hw/rtl/common/clk_gate.sv
