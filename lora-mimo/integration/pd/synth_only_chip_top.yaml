- dir::../ip/grouper/hw/rtl/common/sync.sv
- dir::../../ip/picorv32/picorv32.v
- dir::../ip/grouper/hw/rtl/gpio/gpio_ctrl_pkg.sv
- dir::../ip/grouper/hw/rtl/gpio/ahb_gpio_ctrl.sv
- dir::../ip/grouper/hw/rtl/spi_s/ahb_spi_s.sv
