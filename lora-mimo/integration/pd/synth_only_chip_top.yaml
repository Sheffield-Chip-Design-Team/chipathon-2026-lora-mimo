USE_SLANG: true

# Without ROM_INIT_CONST, ahb_rom.sv falls back to a sim-only `$readmemh`, which
# the slang synth frontend rejects as an unsupported system task (confirmed
# 2026-08-22, job 4664). ROM_INIT_CONST switches it to the ASIC-synthesis path
# (`` `include `PROG_FILE_VMEM ``), matching Grouper's own config.yaml convention.
# Reuses the same firmware image the original AHB integration testbench used.
# Deliberately NOT using DRY_RUN (Grouper's own 64B-boot-ROM/stubbed-SPI-slave
# variant) -- this is meant to be the real design, not the cut-down PD trial.
VERILOG_DEFINES:
- ROM_INIT_CONST
- PROG_FILE_VMEM="code_grouper_trouper.vmem"
VERILOG_INCLUDE_DIRS:
- dir::../fw

# HCLK is tied to Trouper's IQ_CLK in chip_top.v (32 MHz) -- see that file's
# shared-clock-domain assumption, not yet validated.
CLOCK_PORT: HCLK
CLOCK_PERIOD: 31.25
SYNTH_STRATEGY: "AREA 0"
MAX_FANOUT_CONSTRAINT: 16
