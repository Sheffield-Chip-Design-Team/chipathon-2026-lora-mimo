USE_SLANG: true

# Without ROM_INIT_CONST, rom_ss.sv falls back to a sim-only `$readmemh`, which
# the slang synth frontend rejects as an unsupported system task (confirmed
# 2026-08-22, job 4664). ROM_INIT_CONST switches it to the ASIC-synthesis path
# (`` `include "code.vmem" ``), matching Grouper's own config.yaml convention.
# On dev, rom_ss.sv hardcodes `include "code.vmem" (no PROG_FILE_VMEM indirection
# any more), so INCLUDE_DIRS just has to supply that file -- point it at
# Grouper's own sw/boot the same way Grouper's librelane/classic/config.yaml
# does. The old integration/fw/code_grouper_trouper.vmem path is dead.
# Deliberately NOT using DRY_RUN (Grouper's own 64B-boot-ROM/stubbed-SPI-slave
# variant) -- this is meant to be the real design, not the cut-down PD trial.
VERILOG_DEFINES:
- ROM_INIT_CONST
VERILOG_INCLUDE_DIRS:
- dir::../ip/grouper/sw/boot

# HCLK is tied to Trouper's IQ_CLK in chip_top.v (32 MHz) -- see that file's
# shared-clock-domain assumption, not yet validated.
CLOCK_PORT: HCLK
CLOCK_PERIOD: 31.25
SYNTH_STRATEGY: "AREA 0"
MAX_FANOUT_CONSTRAINT: 16
